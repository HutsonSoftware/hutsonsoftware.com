baseURL = "https://hutsonsoftware.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Hutson Software"
enableRobotsTXT = true

# No blog taxonomies on a company site.
disableKinds = ["taxonomy", "term"]

# No RSS. There is no editorial content to syndicate.
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[params]
  description = "Hutson Software, LLC builds and runs its own web applications."
  legalName = "Hutson Software, LLC"
  # Blank until a public contact address exists. The footer link is
  # conditional on this value.
  email = ""
  github = "HutsonSoftware"
  since = 2013

[menu]
  [[menu.main]]
    name = "Products"
    url = "/products/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[build]
  writeStats = false
