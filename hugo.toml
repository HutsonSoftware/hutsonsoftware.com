baseURL = "https://hutsonsoftware.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Hutson Software"
enableRobotsTXT = true

# No blog taxonomies on a company site.
disableKinds = ["taxonomy", "term"]

# No RSS either. There is no editorial content, and the feed republished every
# page's full body, which is how a commented-out email address once ended up
# public. Add RSS back deliberately if a blog ever lands here.
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[params]
  description = "Hutson Software, LLC builds and runs its own web applications."
  legalName = "Hutson Software, LLC"
  # Set this once contact@hutsonsoftware.com exists in Workspace. The footer
  # picks it up automatically. Deliberately blank rather than pointing at a
  # personal address.
  email = ""
  github = "HutsonSoftware"
  since = 2013

[menu]
  [[menu.main]]
    name = "Products"
    url = "/products/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[build]
  writeStats = false
