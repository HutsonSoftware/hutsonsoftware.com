baseURL = "https://hutsonsoftware.com/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "Hutson Software"
enableRobotsTXT = true

# No blog taxonomies on a company site.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Hutson Software, LLC builds and runs its own web applications."
  legalName = "Hutson Software, LLC"
  # Set this once contact@hutsonsoftware.com exists in Workspace. The footer
  # picks it up automatically. Deliberately blank rather than pointing at a
  # personal address.
  email = ""
  github = "HutsonSoftware"
  since = 2013

[menu]
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = true

[build]
  writeStats = false
