name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts; don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
    steps:
      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # baseURL comes from hugo.toml on purpose. Deriving it from
      # configure-pages' base_url output breaks whenever the custom domain
      # isn't attached at build time: Pages reports the project-path URL
      # (…github.io/hutsonsoftware.com) and Hugo bakes that prefix into
      # every link.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
