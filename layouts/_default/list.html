{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</article>
{{ with .Pages }}
<ul class="cards">
  {{ range . }}
  <li class="card">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
