<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <svg class="brand-mark" viewBox="0 0 64 64" width="26" height="26" aria-hidden="true" focusable="false">
        <mask id="brand-h-cut">
          <rect width="64" height="64" fill="#fff"/>
          <rect x="20" y="17" width="7"  height="30" fill="#000"/>
          <rect x="37" y="17" width="7"  height="30" fill="#000"/>
          <rect x="20" y="27" width="24" height="7"  fill="#000"/>
        </mask>
        <rect x="3" y="3" width="58" height="58" rx="15" fill="currentColor" mask="url(#brand-h-cut)"/>
      </svg>
      <span>{{ .Site.Title }}</span>
    </a>
    <nav>
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
