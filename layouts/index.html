{{ define "main" }}
<section class="hero">
  <h1>{{ .Site.Params.legalName }}</h1>
  <p class="lede">{{ .Content }}</p>
</section>

{{ with .Site.GetPage "/projects" }}
<section class="section">
  <h2>Projects</h2>
  <ul class="cards">
    {{ range (where .Site.RegularPages "Section" "projects") }}
    <li class="card">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p>{{ .Description }}</p>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
